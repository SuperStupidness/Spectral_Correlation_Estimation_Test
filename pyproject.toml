[build-system]
requires = [
    "scikit-build-core>=0.9",
    "pybind11>=2.12",
]
build-backend = "scikit_build_core.build"

[project]
name = "spectral-correlation-estimation-test"
version = "0.1.0"
description = "Benchmark suite for cyclostationary spectral correlation estimators, including S3CA."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pandas>=2.3.3",
    "plotly>=6.5.0",
    "pyfftw>=0.15.1",
    "pytest-benchmark>=5.2.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.16.3",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.scikit-build]
cmake.source-dir = "algorithm/s3ca"
cmake.minimum-version = "3.18"
cmake.build-type = "Release"
wheel.packages = ["algorithm", "core", "visualization"]
wheel.exclude = [
    "**/*.cpp",
    "**/*.cc",
    "**/*.h",
    "**/CMakeLists.txt",
    "**/_prebuilt/**",
    "**/verify_data.dat",
]

[tool.uv]
cache-keys = [
    { file = "algorithm/s3ca/CMakeLists.txt" },
    { file = "algorithm/s3ca/src/**" },
]